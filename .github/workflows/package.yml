name: Build and publish plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read plugin version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re

          source = pathlib.Path("pymolplugins/__init__.py").read_text(encoding="utf-8")
          print("version=" + re.search(r'__version__\s*=\s*"([^"]+)"', source).group(1))
          PY

      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pymolplugins/__init__.py $version" >&2
            exit 1
          fi

      - name: Run packaging and layout tests
        run: |
          python3 -m unittest tests.architecture.test_plugin_package \
            tests.architecture.test_package_layout tests.host.test_updater \
            tests.annotation.test_automatic_reference -v

      - name: Build installable Plugin Manager ZIP
        run: python3 scripts/package_plugin.py

      - name: Write checksums
        run: |
          cd dist
          sha256sum PymolPlugins-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PymolPlugins-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published; released assets are immutable."
            exit 0
          fi
          gh release create "$tag" \
            "dist/PymolPlugins-$VERSION.zip" \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "PymolPlugins $VERSION" \
            --generate-notes --latest
